name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: zap test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pinned to zap:latest until this module reaches a 1.0 release (see AGENTS.md).
    container: ghcr.io/zaplang-io/zap:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: sh tools/test.sh
